<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <title>Reset lozinke</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #81c0b3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 420px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="card shadow p-4">
    <h5 class="mb-3 text-center">Nova lozinka</h5>
    <div id="alert" class="d-none alert"></div>
    <div class="mb-3">
      <label class="form-label">Nova lozinka</label>
      <input type="password" id="password" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Potvrdi lozinku</label>
      <input type="password" id="confirm" class="form-control">
    </div>
    <button class="btn btn-primary w-100" onclick="resetPassword()">Promijeni lozinku</button>
  </div>

  <script src="js/utils.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const token = params.get('token');

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!password || password !== confirm) {
        showAlert('Lozinke se ne podudaraju.', 'danger');
        return;
      }

      try {
            const res = await fetch(`${API_URL}/auth/resetPasswordWithToken`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, newPassword: password })
        });
            if (!res.ok) throw new Error();
            showAlert('Lozinka promijenjena! Preusmjeravanje...', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
        } catch (e) {
            showAlert('Link je istekao ili je nevažeći.', 'danger');
        }
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert alert-${type}`;
    }
  </script>
</body>
</html>
