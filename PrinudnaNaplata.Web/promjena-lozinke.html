<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promjena lozinke</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-body">

    <div id="navbar"></div>

    <div class="tab-bar">
        <a href="partije.html" class="tab-link">Partije</a>
        <a href="duznici.html" class="tab-link">Dužnici</a>
        <a href="#" class="tab-link">Šifrarnici</a>
    </div>

    <div class="page-content d-flex justify-content-center align-items-start pt-5">
        <div class="results-card" style="max-width: 420px; width: 100%;">
            <h5 class="mb-4" style="color: var(--text-primary);">Promjena lozinke</h5>

            <div class="filter-group">
                <label class="filter-label">Trenutna lozinka</label>
                <div class="input-group">
                    <input type="password" class="form-control dark-input" id="currentPassword" />
                    <button class="btn btn-outline-secondary" type="button" id="toggleCurrent">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">Nova lozinka</label>
                <div class="input-group">
                    <input type="password" class="form-control dark-input" id="newPassword" />
                    <button class="btn btn-outline-secondary" type="button" id="toggleNew">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">Potvrdi novu lozinku</label>
                <div class="input-group">
                    <input type="password" class="form-control dark-input" id="confirmPassword" />
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirm">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div id="errorMsg" class="alert alert-danger mt-3" style="display:none;"></div>
            <div id="successMsg" class="alert alert-success mt-3" style="display:none;">Lozinka uspješno promijenjena.</div>

            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primary flex-fill" id="btnSave">
                    <i class="bi bi-check-lg"></i> Sačuvaj
                </button>
                <button class="btn btn-outline-secondary flex-fill" id="btnCancel">
                    Odustani
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/promjena-lozinke.js"></script>
</body>
</html>
