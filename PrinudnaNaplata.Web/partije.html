<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partije</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .adv-select { font-size: 12px; padding: 3px 6px; height: 28px; }
        .adv-input  { font-size: 12px; padding: 3px 6px; height: 28px; }
        .adv-label  { font-size: 11px; margin-bottom: 2px; color: #adb5bd; display: block; }
        .adv-group  { margin-bottom: 6px; }
        .adv-title  { font-size: 11px; font-weight: 600; text-transform: uppercase;
                      letter-spacing: .05em; color: #6c757d; margin: 10px 0 6px; }
    </style>
</head>
<body class="dark-body">

    <div id="navbar"></div>

    <div class="tab-bar">
        <a href="partije.html" class="tab-link active">Partije</a>
        <a href="duznici.html" class="tab-link">Dužnici</a>
        <a href="#" class="tab-link">Šifrarnici</a>
    </div>

    <div class="page-content">

        <div class="filter-card mb-3">

            <!-- Quick search bar -->
            <div class="d-flex gap-2 align-items-end flex-wrap">
                <div style="flex:1; min-width: 200px;">
                    <label class="filter-label">Brza pretraga</label>
                    <input type="text" class="form-control dark-input" id="f_sve" placeholder="Pretraži po svim poljima..." />
                </div>
                <div style="min-width: 140px;">
                    <label class="filter-label">Broj partije</label>
                    <input type="text" class="form-control dark-input" id="f_brojpartije" />
                </div>
                <div style="min-width: 140px;">
                    <label class="filter-label">Ime dužnika</label>
                    <input type="text" class="form-control dark-input" id="f_ime" />
                </div>
                <div style="min-width: 140px;">
                    <label class="filter-label">I/lv/p/ipv/mal br.</label>
                    <input type="text" class="form-control dark-input" id="f_resenjebroj" />
                </div>
                <button class="btn btn-outline-primary" id="btnAdvanced" type="button">
                    <i class="bi bi-sliders"></i> Napredna
                </button>
                <button class="btn btn-primary" id="btnPrikazi">
                    <i class="bi bi-search"></i> Prikaži
                </button>
                <button class="btn btn-outline-secondary" id="btnReset">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>

            <!-- Advanced filters panel -->

                <div class="sidebar-divider mt-3 mb-3"></div>
                <div class="row g-3">

                    <!-- Column 1: Opšto (4) + Iznosi (5) = 9 -->

                        <div class="adv-group">
                            <label class="adv-label">Nadl. organ</label>
                            <select class="form-select dark-input adv-select" id="f_sudid">
                                <option value="">Prikaži sve</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prav./Fiz. lica</label>
                            <select class="form-select dark-input adv-select" id="f_pravnolice">
                                <option value="">Prikaži sve</option>
                                <option value="1">Pravno lice</option>
                                <option value="0">Fizičko lice</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Javna objava</label>
                            <select class="form-select dark-input adv-select" id="f_javnaobjava">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Zaveden kod pov.</label>
                            <input type="text" class="form-control dark-input adv-input" id="f_zavedenkodpov" />
                        </div>
                        <div class="adv-title">Iznosi</div>
                        <div class="adv-group">
                            <label class="adv-label">Ukupan dug &gt;</label>
                            <input type="number" class="form-control dark-input adv-input" id="f_ukupandug" />
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Dug prema pov. &gt;</label>
                            <input type="number" class="form-control dark-input adv-input" id="f_dugpov" />
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Dug prema adv. &gt;</label>
                            <input type="number" class="form-control dark-input adv-input" id="f_dugadv" />
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Fakturisano povj. %</label>
                            <input type="number" class="form-control dark-input adv-input" id="f_fakturisanoprocenat" />
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Uplatio iznos &gt;</label>
                            <input type="number" class="form-control dark-input adv-input" id="f_platioiznos" />
                        </div>
                    </div>

                        <div class="adv-group">
                            <label class="adv-label">Predato</label>
                            <div class="d-flex gap-1">
                                <div class="flex-fill">
                                    <small class="adv-label">Od</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_predatood" />
                                </div>
                                <div class="flex-fill">
                                    <small class="adv-label">Do</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_predatodo" />
                                </div>
                            </div>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Donijeto</label>
                            <div class="d-flex gap-1">
                                <div class="flex-fill">
                                    <small class="adv-label">Od</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_donijetood" />
                                </div>
                                <div class="flex-fill">
                                    <small class="adv-label">Do</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_donijetodo" />
                                </div>
                            </div>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Izvršno</label>
                            <div class="d-flex gap-1">
                                <div class="flex-fill">
                                    <small class="adv-label">Od</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_izvrsnodanaod" />
                                </div>
                                <div class="flex-fill">
                                    <small class="adv-label">Do</small>
                                    <input type="date" class="form-control dark-input adv-input" id="f_izvrsnodanado" />
                                </div>
                            </div>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Odlaganje do</label>
                            <input type="date" class="form-control dark-input adv-input" id="f_odlaganjedo" />
                        </div>
                        <div class="adv-title">Prigovor</div>
                        <div class="adv-group">
                            <label class="adv-label">Prigovor</label>
                            <select class="form-select dark-input adv-select" id="f_prigovor">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prigovor usvojen</label>
                            <select class="form-select dark-input adv-select" id="f_prigovorusvojen">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prigovor odbijen</label>
                            <select class="form-select dark-input adv-select" id="f_prigovorodbijen">
                                <option value="">Prikaži sve</option>

                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prigovor odbačen</label>
                            <select class="form-select dark-input adv-select" id="f_prigovorodbacen">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                    </div>

                    <!-- Column 3: Status (8) + Imovina top (2) = 10 -->

                        <div class="adv-title">Status</div>

                            <label class="adv-label">Odlaganje</label>
                            <select class="form-select dark-input adv-select" id="f_odlaganje">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Odbačen</label>
                            <select class="form-select dark-input adv-select" id="f_odbacen">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prekinut</label>

                                <option value="false">Ne</option>

                        <div class="adv-group">

                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Obustavljen</label>
                            <select class="form-select dark-input adv-select" id="f_obustavljen">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>

                        <div class="adv-group">

                                <option value="true">Da</option>

                        </div>
                        <div class="adv-group">

                            <select class="form-select dark-input adv-select" id="f_poravnanje">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>

                        <div class="adv-group">
                            <label class="adv-label">Zaključena</label>
                            <select class="form-select dark-input adv-select" id="f_zakljucena">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-title">Imovina</div>
                        <div class="adv-group">
                            <label class="adv-label">Pokretna imovina</label>
                            <select class="form-select dark-input adv-select" id="f_predlpokrimovina">
                                <option value="">Prikaži sve</option>

                            </select>
                        </div>

                    <!-- Column 4: Izvršenje (10) + Imovina ostatak (5) = 15 -->
                    <div class="col-md-3">
                        <div class="adv-title">Izvršenje / Fakturisanje</div>
                        <div class="adv-group">
                            <label class="adv-label">Izvršno rješenje suda</label>
                            <select class="form-select dark-input adv-select" id="f_izvrsnoResenjeSuda">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Prvostepena presuda</label>
                            <select class="form-select dark-input adv-select" id="f_prvostepenaPresuda">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Žalba</label>
                            <select class="form-select dark-input adv-select" id="f_zalba">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">

                            <select class="form-select dark-input adv-select" id="f_drugostepenaPresuda">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Izvršenje po presudi</label>
                            <select class="form-select dark-input adv-select" id="f_izvrsenjePoPresudi">

                                <option value="false">Ne</option>

                            <select class="form-select dark-input adv-select" id="f_zakljucaknalognisupostupili">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>

                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Fakturisati</label>
                            <select class="form-select dark-input adv-select" id="f_fakturisati">
                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>
                            </select>
                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Ne fakturisati</label>
                            <select class="form-select dark-input adv-select" id="f_nefakturisati">
                                <option value="">Prikaži sve</option>

                                <option value="false">Ne</option>
                            </select>

                        <div class="adv-title">Imovina (nastavak)</div>

                                <option value="">Prikaži sve</option>
                                <option value="true">Da</option>
                                <option value="false">Ne</option>

                        </div>
                        <div class="adv-group">
                            <label class="adv-label">Nekretnina</label>

        <!-- Results table -->
        <div class="results-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small" id="resultCount"></span>
            </div>
            <div class="table-responsive">
                <table class="table dark-table">
                    <thead>
                        <tr>
                            <th>Br. partije</th>
                            <th>Dužnik</th>
                            <th>I br.</th>
                            <th>IV br.</th>
                            <th>Predato dana</th>
                            <th>Donijeto dana</th>
                            <th>Sudske takse</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted py-4">Unesite kriterijume i kliknite Prikaži</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="d-flex gap-1 flex-wrap mt-2"></div>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
