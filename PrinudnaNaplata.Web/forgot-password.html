<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <title>Zaboravljena lozinka</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #81c0b3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 420px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="card shadow p-4">
    <h5 class="mb-3 text-center">Zaboravljena lozinka</h5>
    <div id="alert" class="d-none alert"></div>
    <div class="mb-3">
      <label class="form-label">Email adresa</label>
      <input type="email" id="email" class="form-control" placeholder="vas@email.com">
    </div>
    <button class="btn btn-primary w-100" onclick="sendReset()">Pošalji link</button>
    <div class="text-center mt-3">
      <a href="index.html">← Nazad na prijavu</a>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    async function sendReset() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showAlert('Unesite email adresu.', 'danger');
        return;
      }

      try {
            const res = await fetch(`${API_URL}/auth/forgotPassword`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (!res.ok) throw new Error();
            showAlert('Ako email postoji, link za reset je poslan.', 'success');
    } catch (e) {
        showAlert('Greška. Pokušajte ponovo.', 'danger');
    }
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert alert-${type}`;
    }
  </script>
</body>
</html>
